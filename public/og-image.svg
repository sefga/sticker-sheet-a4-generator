<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Sheet Mockup on the right -->
  <g transform="translate(720, 65)" filter="url(#shadow)">
    <!-- A4 Paper -->
    <rect width="360" height="500" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Margins dashed -->
    <rect x="15" y="15" width="330" height="470" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Grid of 10 stickers (2 cols x 5 rows) -->
    <g fill="#f97316" rx="4">
      <rect x="25" y="25" width="150" height="85" rx="4" />
      <rect x="185" y="25" width="150" height="85" rx="4" />
      <rect x="25" y="118" width="150" height="85" rx="4" />
      <rect x="185" y="118" width="150" height="85" rx="4" />
      <rect x="25" y="211" width="150" height="85" rx="4" />
      <rect x="185" y="211" width="150" height="85" rx="4" />
      <rect x="25" y="304" width="150" height="85" rx="4" />
      <rect x="185" y="304" width="150" height="85" rx="4" />
      <rect x="25" y="397" width="150" height="85" rx="4" />
      <rect x="185" y="397" width="150" height="85" rx="4" />
    </g>

    <!-- Badge -->
    <rect x="270" y="-15" width="75" height="30" rx="15" fill="#2563eb" />
    <text x="307" y="5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">10 шт.</text>
  </g>

  <!-- Left Content: Typography & Value Props -->
  <g transform="translate(100, 130)">
    <!-- Pill Badge -->
    <rect width="210" height="36" rx="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="105" y="23" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🏷️ ВЕРСТКА НАКЛЕЕК А4</text>

    <!-- Title -->
    <text x="0" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">
      Генератор раскладки
    </text>
    <text x="0" y="145" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">
      стикеров на листе A4
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">
      Точные физические размеры в мм • Контроль DPI
    </text>
    <text x="0" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">
      Метки реза • Bleed • Экспорт в векторный PDF 100%
    </text>

    <!-- Features Pills -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">⚡ 100% В браузере</text>

      <rect x="175" y="0" width="150" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="250" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">📐 Масштаб 1:1</text>

      <rect x="340" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="430" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">📄 Векторный PDF</text>
    </g>

    <!-- URL Tagline -->
    <text x="0" y="380" fill="#64748b" font-family="monospace" font-size="16">
      sticker-sheet-a4-generator.vercel.app
    </text>
  </g>
</svg>
